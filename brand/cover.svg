<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0B0B10"/><stop offset="0.55" stop-color="#0A0C11"/>
      <stop offset="1" stop-color="#071410"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20202B"/><stop offset="1" stop-color="#171720"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1FC489"/><stop offset="0.5" stop-color="#43E0AC"/>
      <stop offset="1" stop-color="#A6FFE2"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#34D399" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0B10"/><stop offset="1" stop-color="#0B0B10" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- the grid runs off the right edge, oversized, so it reads as a wall -->
  <g transform="translate(742,-96)">
    <g fill="url(#cell)" stroke="#2C2C38" stroke-width="3">
      <rect x="0"   y="0"   width="190" height="190" rx="42"/>
      <rect x="214" y="0"   width="190" height="190" rx="42"/>
      <rect x="428" y="0"   width="190" height="190" rx="42"/>
      <rect x="0"   y="214" width="190" height="190" rx="42"/>
      <rect x="428" y="214" width="190" height="190" rx="42"/>
      <rect x="0"   y="428" width="190" height="190" rx="42"/>
      <rect x="428" y="428" width="190" height="190" rx="42"/>
      <rect x="0"   y="642" width="190" height="190" rx="42"/>
      <rect x="214" y="642" width="190" height="190" rx="42"/>
      <rect x="428" y="642" width="190" height="190" rx="42"/>
    </g>

    <!-- the doorway burned through the wall -->
    <g filter="url(#bloom)">
      <path d="M214 309 a95 95 0 0 1 190 0 v309 h-190 z" fill="url(#door)"/>
    </g>
    <path d="M252 618 v-271 a57 57 0 0 1 114 0 v271 z" fill="#06080A"/>
  </g>

  <!-- light thrown left across the cover -->
  <path d="M0 120 L800 300 L800 430 L0 560 Z" fill="url(#beam)" filter="url(#haze)"/>
  <rect x="0" y="0" width="620" height="630" fill="url(#fade)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,sans-serif">
    <text x="84" y="252" font-size="94" font-weight="800" letter-spacing="-4.5" fill="#FBFBFD">deCAPTCHA</text>
    <text x="86" y="318" font-size="32" font-weight="600" letter-spacing="-0.6" fill="#43E0AC">A CAPTCHA that lets real agents through,</text>
    <text x="86" y="362" font-size="32" font-weight="600" letter-spacing="-0.6" fill="#43E0AC">not just real humans.</text>
    <text x="86" y="426" font-size="22" fill="#8E8E9C">One World Selfie Check, and your agent inherits access that is</text>
    <text x="86" y="458" font-size="22" fill="#8E8E9C">scoped, expiring, and revocable. Enforced by ENSv2, not by us.</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
    <g><rect x="86" y="512" width="126" height="40" rx="10" fill="#14141B" stroke="#2C2C38" stroke-width="1.5"/>
       <text x="107" y="538" fill="#8E8E9C">World ID</text></g>
    <g><rect x="224" y="512" width="184" height="40" rx="10" fill="#14141B" stroke="#2C2C38" stroke-width="1.5"/>
       <text x="245" y="538" fill="#8E8E9C">ENSv2 · Sepolia</text></g>
    <g><rect x="420" y="512" width="132" height="40" rx="10" fill="#14141B" stroke="#2C2C38" stroke-width="1.5"/>
       <text x="441" y="538" fill="#8E8E9C">ETHOnline</text></g>
  </g>
</svg>
