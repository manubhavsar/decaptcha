<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#0B0B10"/><stop offset="0.55" stop-color="#0A0C11"/>
      <stop offset="1" stop-color="#071410"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20202B"/><stop offset="1" stop-color="#171720"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1FC489"/><stop offset="0.5" stop-color="#43E0AC"/>
      <stop offset="1" stop-color="#A6FFE2"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#34D399" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0B10"/><stop offset="1" stop-color="#0B0B10" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <g transform="translate(806,-70)">
    <g fill="url(#cell)" stroke="#2C2C38" stroke-width="3">
      <rect x="0"   y="0"   width="196" height="196" rx="44"/>
      <rect x="222" y="0"   width="196" height="196" rx="44"/>
      <rect x="444" y="0"   width="196" height="196" rx="44"/>
      <rect x="0"   y="222" width="196" height="196" rx="44"/>
      <rect x="444" y="222" width="196" height="196" rx="44"/>
      <rect x="0"   y="444" width="196" height="196" rx="44"/>
      <rect x="444" y="444" width="196" height="196" rx="44"/>
      <rect x="0"   y="666" width="196" height="196" rx="44"/>
      <rect x="222" y="666" width="196" height="196" rx="44"/>
      <rect x="444" y="666" width="196" height="196" rx="44"/>
    </g>
    <g filter="url(#bloom)">
      <path d="M222 320 a98 98 0 0 1 196 0 v318 h-196 z" fill="url(#door)"/>
    </g>
    <path d="M262 638 v-280 a58 58 0 0 1 116 0 v280 z" fill="#06080A"/>
  </g>

  <path d="M0 150 L860 340 L860 480 L0 620 Z" fill="url(#beam)" filter="url(#haze)"/>
  <rect x="0" y="0" width="680" height="720" fill="url(#fade)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,sans-serif">
    <text x="88" y="292" font-size="98" font-weight="800" letter-spacing="-4.8" fill="#FBFBFD">deCAPTCHA</text>
    <text x="90" y="360" font-size="33" font-weight="600" letter-spacing="-0.6" fill="#43E0AC">A CAPTCHA that lets real agents through,</text>
    <text x="90" y="404" font-size="33" font-weight="600" letter-spacing="-0.6" fill="#43E0AC">not just real humans.</text>
    <text x="90" y="468" font-size="22" fill="#8E8E9C">Drop-in replacement for reCAPTCHA. Humans type the characters.</text>
    <text x="90" y="500" font-size="22" fill="#8E8E9C">Agents pass if a human vouched for them, on terms that human set.</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
    <g><rect x="90" y="552" width="196" height="42" rx="10" fill="#14141B" stroke="#2C2C38" stroke-width="1.5"/>
       <text x="111" y="579" fill="#8E8E9C">ENSv2 · Sepolia</text></g>
    <g><rect x="298" y="552" width="188" height="42" rx="10" fill="#14141B" stroke="#2C2C38" stroke-width="1.5"/>
       <text x="319" y="579" fill="#8E8E9C">Self-verifying</text></g>
    <g><rect x="498" y="552" width="146" height="42" rx="10" fill="#14141B" stroke="#2C2C38" stroke-width="1.5"/>
       <text x="519" y="579" fill="#8E8E9C">ETHOnline</text></g>
  </g>
</svg>
