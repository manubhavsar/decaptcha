<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- deCAPTCHA.
       A reCAPTCHA-style image-select grid with a lit doorway burned through it.
       The grid says CAPTCHA at a glance; the door says something is allowed to
       pass. Together: a gate that opens for the right traveller. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191921"/><stop offset="1" stop-color="#08080B"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23232E"/><stop offset="1" stop-color="#1B1B24"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#21C88E"/><stop offset="0.55" stop-color="#43E0AC"/>
      <stop offset="1" stop-color="#9CFFDC"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43E0AC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#43E0AC" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="#2E2E3A" stroke-width="4"/>

  <!-- light thrown onto the tile by the open door -->
  <ellipse cx="256" cy="392" rx="150" ry="52" fill="#2FD39B" opacity="0.10" filter="url(#soft)"/>

  <!-- eight refused cells -->
  <g fill="url(#cell)" stroke="#33333F" stroke-width="2.5">
    <rect x="94"  y="94"  width="96" height="96" rx="22"/>
    <rect x="208" y="94"  width="96" height="96" rx="22"/>
    <rect x="322" y="94"  width="96" height="96" rx="22"/>
    <rect x="94"  y="208" width="96" height="96" rx="22"/>
    <rect x="322" y="208" width="96" height="96" rx="22"/>
    <rect x="94"  y="322" width="96" height="96" rx="22"/>
    <rect x="322" y="322" width="96" height="96" rx="22"/>
  </g>

  <!-- the doorway: centre and bottom-centre fused into one arch -->
  <g filter="url(#bloom)">
    <path d="M208 256 a48 48 0 0 1 96 0 v162 h-96 z" fill="url(#door)"/>
  </g>

  <!-- the opening itself, and the light spilling out of it -->
  <path d="M228 418 v-154 a28 28 0 0 1 56 0 v154 z" fill="#07070A"/>
  <path d="M228 418 v-154 a28 28 0 0 1 56 0 v154 z" fill="url(#spill)" opacity="0.5"/>

</svg>
