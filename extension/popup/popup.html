<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
<title>deCAPTCHA</title>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span><strong>deCAPTCHA</strong></div>
  <span id="chain" class="chip">…</span>
</header>

<!-- 1. Authorise an agent -->
<section id="view-mint" class="view">
  <h1>Authorise an agent</h1>
  <p class="muted">
    You sign these terms. The signature goes on chain with the vouch, so anyone
    can check you really agreed to them.
  </p>

  <div id="gate-status" class="notice" hidden></div>

  <label class="field">
    <span>Verifications allowed</span>
    <input id="scope" type="number" min="1" max="10" value="2" />
  </label>
  <label class="field">
    <span>Expires in (hours)</span>
    <input id="ttl" type="number" min="1" max="168" value="24" />
  </label>

  <button id="mint" class="primary">Sign &amp; mint on Sepolia</button>
  <div id="mint-status" class="notice" hidden></div>
</section>

<!-- 4. Live vouch -->
<section id="view-vouch" class="view" hidden>
  <h1>Vouch active</h1>
  <div class="name" id="vouch-name"></div>

  <dl class="facts">
    <div><dt>Scope</dt><dd id="f-scope">—</dd></div>
    <div><dt>Expires</dt><dd id="f-expiry">—</dd></div>
    <div><dt>Authorisation</dt><dd id="f-auth">—</dd></div>
    <div><dt>Status</dt><dd id="f-status">—</dd></div>
  </dl>

  <div class="perm">
    <div class="perm-head">Write permission, read from ENSv2</div>
    <ul id="perm-rows"></ul>
  </div>

  <div class="actions">
    <button id="self-extend" class="ghost danger-ghost">Agent: try to extend scope</button>
    <button id="revoke" class="primary danger">Revoke now</button>
  </div>
  <div id="action-status" class="notice" hidden></div>

  <a id="explorer" class="link" target="_blank" rel="noopener">View resolver on Etherscan →</a>
  <button id="forget" class="ghost small">Forget this vouch</button>
</section>

<script src="popup.js"></script>
</body>
</html>
